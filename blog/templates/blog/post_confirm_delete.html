{% extends "blog/base.html" %}
{% block title %}Eliminar | Mi Blog{% endblock %}
{% block content %}<section class="form-box"><h1>¿Eliminar publicación?</h1><p>Vas a eliminar “{{ post.title }}”. Esta acción no se puede deshacer.</p><form method="post">{% csrf_token %}<button class="button danger" type="submit">Sí, eliminar</button><a class="cancel" href="{% url 'post_detail' post.pk %}">Cancelar</a></form></section>{% endblock %}
